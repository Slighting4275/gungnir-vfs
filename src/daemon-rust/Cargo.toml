[package]
name = "gungnird"
version = "0.0.0"
edition = "2024"
license = "GPL-3.0-or-later AND AGPL-3.0-or-later"
publish = false

[dependencies]
blake3 = "1"
libc = "0.2"
io-uring = "0.7"
rusqlite = { version = "0.42", features = ["bundled"] }

[features]
# Integration-test hooks (milestone 7): GUNGNIR_TEST_FAKE_HUNG_MOUNT=<dir> makes gungnird
# treat <dir> as a mount whose health probes never return. Off in normal builds; the
# Zig integration test builds gungnird with it.
test-hooks = []

# Test-only helper for the cross-user tests (tests/lifecycle.rs); built only with the
# test-hooks feature, never shipped.
[[bin]]
name = "gungnir-peer-probe"
path = "tests/bin/peer_probe.rs"
required-features = ["test-hooks"]
test = false
