[build]
# All cargo output under ./.build (AGENTS.md §3). Config-relative, so it applies
# from the repo root and from src/daemon-rust alike.
target-dir = ".build/target"

[env]
TMPDIR = { value = ".build/tmp", relative = true }
# Every gungnird a test starts, however it starts it, keeps to the test's own trash
# volumes: the host's btrfs subvolumes stay out (hooks::NO_HOST_SUBVOLS_ENV, honoured by
# test-hooks builds; a release build ignores it quietly). Also applies to a daemon
# started with `cargo run`.
GUNGNIR_TEST_NO_HOST_SUBVOLS = "1"
