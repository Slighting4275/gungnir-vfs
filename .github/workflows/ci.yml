# GitHub Actions for the GitHub mirror (github.com/Slighting4275/gungnir-vfs): the same
# jobs as .gitlab-ci.yml, which stays the project's CI of record (merge requests, the
# protected main). Each job runs one `./check` subcommand after tools/ci-setup, in the
# same pinned archlinux image, from the same Arch Linux Archive day (./check rules keeps
# both in step with .gitlab-ci.yml).
#
# Runs on pushes to the mirror if GitLab has no visible successful pipeline for
# the commit. An unavailable archive switches the whole run to live Arch mirrors.
# Manual runs always check on GitHub, can choose the mirror, and can add the benchmark.

name: CI

on:
  push:
  workflow_dispatch:
    inputs:
      mirrors:
        description: "auto: use live mirrors if the pinned archive is unavailable"
        type: choice
        options: [auto, archive, live]
        default: auto
      perf:
        description: "Also run the 50k-event benchmark (./check perf)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The day pacman installs from; the same day as the image below and as
  # .gitlab-ci.yml's arch_snapshot default.
  ARCH_SNAPSHOT_PINNED: "2026/11/08"
  CARGO_TERM_COLOR: "never"
  GUNGNIR_ALLOW_MISSING: "1"

# Every build/test job uses the pinned Arch image. Test containers need io_uring
# (blocked by Docker's default seccomp profile) and private test mounts (blocked
# by docker-default AppArmor). The test host uses Ubuntu 22.04 because Ubuntu
# 24.04 also restricts capabilities within unprivileged user namespaces.
jobs:
  route:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      provider: ${{ steps.provider.outputs.provider }}
      snapshot: ${{ steps.archive.outputs.snapshot }}
    steps:
      - id: provider
        env:
          GITLAB_PROJECT_ID: '87989401'
        run: |
          pipeline=$(curl -fsS --connect-timeout 5 --max-time 15 \
            "https://gitlab.com/api/v4/projects/$GITLAB_PROJECT_ID/pipelines?sha=$GITHUB_SHA&per_page=20" |
            jq -r --arg sha "$GITHUB_SHA" --arg ref "$GITHUB_REF_NAME" '
              first(.[] | select(.sha == $sha and
                ((.source == "push" and .ref == $ref) or .source == "merge_request_event"))) |
              select(.status == "success") | .web_url') || pipeline=
          if [ "$GITHUB_EVENT_NAME" = push ] && [ -n "$pipeline" ]; then
            echo 'provider=gitlab' >>"$GITHUB_OUTPUT"
            printf 'GitLab CI passed for %s: %s\n' "$GITHUB_SHA" "$pipeline" >>"$GITHUB_STEP_SUMMARY"
          else
            echo 'provider=github' >>"$GITHUB_OUTPUT"
            printf 'Running CI on GitHub for %s.\n' "$GITHUB_SHA" >>"$GITHUB_STEP_SUMMARY"
          fi
      - if: steps.provider.outputs.provider == 'github'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: archive
        if: steps.provider.outputs.provider == 'github'
        env:
          MIRROR_MODE: ${{ inputs.mirrors || 'auto' }}
        run: |
          snapshot=$(tools/ci-archive "$ARCH_SNAPSHOT_PINNED" "$MIRROR_MODE")
          printf 'snapshot=%s\n' "$snapshot" >>"$GITHUB_OUTPUT"
          printf 'Package source: %s\n' "${snapshot:-live Arch mirrors}" >>"$GITHUB_STEP_SUMMARY"

  rust-lint:
    needs: route
    if: needs.route.outputs.provider == 'github'
    runs-on: ubuntu-24.04
    # archlinux:base-20261108.0.623074, pinned by digest (the tag alone can be re-pushed).
    container: &container
      image: &arch-image archlinux:base-20261108.0.623074@sha256:d4594bb2300cba11f41c2f27923eb56f63d9988909c402f9c95517d1e362c899
    timeout-minutes: 20
    steps:
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - &env
        name: Job environment
        env:
          SNAPSHOT: ${{ needs.route.outputs.snapshot }}
        run: |
          {
            echo "ARCH_SNAPSHOT=$SNAPSHOT"
            echo "CARGO_HOME=$GITHUB_WORKSPACE/.build/cargo-home"
            echo "ZIG_GLOBAL_CACHE_DIR=$GITHUB_WORKSPACE/.build/zig-global-cache"
          } >>"$GITHUB_ENV"
      - &setup-rust
        run: tools/ci-setup rust
      - &cargo-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: cargo-release-${{ hashFiles('Cargo.lock') }}
          path: &cargo-paths |
            .build/cargo-home/registry/index/
            .build/cargo-home/registry/cache/
            .build/cargo-home/git/db/
            .build/target/
      - run: ./check rust-static

  zig-lint:
    needs: route
    if: needs.route.outputs.provider == 'github'
    runs-on: ubuntu-24.04
    container: *container
    timeout-minutes: 20
    steps:
      - *checkout
      - *env
      - &setup-zig
        run: |
          tools/ci-setup zig
          echo "$GITHUB_WORKSPACE/.build/zig-dl/zig" >>"$GITHUB_PATH"
      - run: ./check zig-static

  # Only this job saves the cargo cache; every other job only restores it.
  rust-build:
    needs: [route, rust-lint]
    runs-on: ubuntu-24.04
    container: *container
    timeout-minutes: 20
    steps:
      - *checkout
      - *env
      - *setup-rust
      - *cargo-restore
      # Builds the release gungnird; the shipped daemon must never carry the test hooks.
      - run: ./check release-hooks
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: cargo-release-${{ hashFiles('Cargo.lock') }}
          path: *cargo-paths

  zig-build:
    needs: [route, zig-lint]
    runs-on: ubuntu-24.04
    container: *container
    timeout-minutes: 20
    steps:
      - *checkout
      - *env
      - *setup-zig
      - *cargo-restore
      # Builds the module: three GIO exports only, no test hook, indexed by gio-querymodules.
      - run: ./check zig-artifacts

  # The tests run as the unprivileged `tester` (tools/ci-setup tester says why).
  rust-test:
    needs: [route, rust-build]
    runs-on: &test-runner ubuntu-22.04
    container: &test-container
      image: *arch-image
      options: --security-opt seccomp=unconfined --security-opt apparmor=unconfined --device /dev/fuse
    timeout-minutes: 25
    steps:
      - *checkout
      - *env
      - *setup-rust
      - *cargo-restore
      - run: |
          tools/ci-setup tester
          runuser -u tester -- ./check test default

  # The test-hooks build's tests, then the cross-user tests again as root, which drops to
  # `nobody` for its second user: no opt-out, they must run or fail.
  rust-test-hooks:
    needs: [route, rust-build]
    runs-on: *test-runner
    container: *test-container
    timeout-minutes: 25
    steps:
      - *checkout
      - *env
      - *setup-rust
      - *cargo-restore
      - run: |
          tools/ci-setup tester
          runuser -u tester -- ./check test hooks
          chown -R root:root .build
          ./check cross-user

  # The thread-pool fallback engine, forced (D-048, RC-F022).
  rust-test-no-uring:
    needs: [route, rust-build]
    runs-on: *test-runner
    container: *test-container
    timeout-minutes: 25
    steps:
      - *checkout
      - *env
      - *setup-rust
      - *cargo-restore
      - run: |
          tools/ci-setup tester
          runuser -u tester -- ./check test no-uring

  # GitLab hands rust:build's gungnird to this job as an artifact; here it is rebuilt
  # (incrementally, from the restored cache) before the itest checks it carries no hook.
  zig-test:
    needs: [route, zig-build, rust-build]
    runs-on: *test-runner
    container: *test-container
    timeout-minutes: 25
    steps:
      - *checkout
      - *env
      - *setup-zig
      - *cargo-restore
      - run: |
          tools/ci-setup tester
          runuser -u tester -- ./check release-hooks
          runuser -u tester -- ./check zig-test

  # The 50k-event benchmark (AGENTS.md §4): by hand only, shared runners make its timing
  # noisy (D-055); when it runs, a missed SLO fails the run.
  rust-perf:
    if: github.event_name == 'workflow_dispatch' && inputs.perf
    needs: [route, rust-build]
    runs-on: *test-runner
    container: *test-container
    timeout-minutes: 25
    steps:
      - *checkout
      - *env
      - *setup-rust
      - *cargo-restore
      - run: ./check perf
