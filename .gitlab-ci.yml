spec:
  inputs:
    arch_snapshot:
      description: >-
        The Arch Linux Archive day pacman installs from (YYYY/MM/DD, the same day as the
        pinned image below). Empty: the live mirrors, for when the archive is down; such a
        run gets today's packages instead of the pinned ones.
      default: "2026/11/08"
      regex: '^(\d{4}/\d{2}/\d{2})?$'
---
# GitLab CI for Gungnir: Zig GIO module (src/client-zig) + Rust daemon (src/daemon-rust).
# Each job runs one `./check` subcommand (the gates of AGENTS.md §4 live there, once);
# a job adds only its environment: the tester user, the skip opt-outs, root for
# `./check cross-user`. All output stays under .build/ (AGENTS.md §3).
#
# Reproducible base: the archlinux image is pinned by tag AND digest, and pacman installs
# from the Arch Linux Archive snapshot of the same day (ARCH_SNAPSHOT, from the input
# arch_snapshot above), so every run gets the same packages. To move forward, bump both
# together: the input's default and the image (tags: hub.docker.com/_/archlinux; take
# the digest from the registry, `docker-content-digest` of the tag's index manifest).
# The archive down: run a pipeline by hand (Build > Pipelines > New pipeline) with the
# input arch_snapshot empty, to use the live mirrors instead. Pipeline variables cannot
# be set by hand in this project, so this is an input.
#
# Zig is the current master tarball from ziglang.org, accepted only if its minisign
# signature verifies against Zig's pinned public key, the signed trusted comment names
# exactly that file, the sha256 matches index.json, and it is not older than
# build.zig.zon's minimum_zig_version (Zig itself does not enforce that field).

workflow:
  rules:
    # Scheduled and manually started (web) pipelines always run: rust:perf runs only there,
    # and a branch with an open MR would otherwise get no such pipeline (rule below).
    - if: $CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

stages:
  - lint
  - build
  - test

variables:
  ARCH_SNAPSHOT: "$[[ inputs.arch_snapshot ]]"
  CARGO_HOME: "$CI_PROJECT_DIR/.build/cargo-home"
  CARGO_TERM_COLOR: "never"
  ZIG_GLOBAL_CACHE_DIR: "$CI_PROJECT_DIR/.build/zig-global-cache"
  ZIG_INDEX_URL: "https://ziglang.org/download/index.json"
  # Zig's published minisign key (https://ziglang.org/download/).
  ZIG_PUBKEY: "RWSGOq2NVecA2UPNdBUZykf1CCb147pkmdtYxgb3Ti+JO/wCYvhbAb/U"

default:
  # archlinux:base-20261108.0.623074, pinned by digest (the tag alone can be re-pushed).
  image: archlinux:base-20261108.0.623074@sha256:d4594bb2300cba11f41c2f27923eb56f63d9988909c402f9c95517d1e362c899
  interruptible: true
  # No `timeout:` here: GitLab accepts it under `default:` but never applies it (only a
  # job's own or extended `timeout:` counts; gitlab-org/gitlab#213634), so it is set in
  # .rust and .zig below instead.
  # Retry only failures of the CI infrastructure itself. Never script_failure: a failing
  # build or test must fail the pipeline, not get a second try that can hide a flake
  # (D-002, AUD-04). Never job_execution_timeout or stuck_or_timeout_failure either: a
  # job that hits its `timeout:` may be an intermittent hang, the bug class this project
  # exists to prevent, and a green retry would hide it (RC-F020). Network installs retry
  # in-script.
  retry:
    max: 1
    when: [runner_system_failure, api_failure, scheduler_failure]

# Cargo registry + target dir, keyed on Cargo.lock. Only rust:build uploads it; every
# other job only downloads, so parallel jobs never race to overwrite the same cache.
.cargo-cache: &cargo-cache
  key:
    files: [Cargo.lock]
    prefix: cargo-release
  paths:
    - .build/cargo-home/registry/index/
    - .build/cargo-home/registry/cache/
    - .build/cargo-home/git/db/
    - .build/target/
  policy: pull

# The verified Zig tarball and its signature (re-verified on every use).
.zig-cache: &zig-cache
  key: zig-master-x86_64-linux
  paths:
    - .build/zig-dl/cache/
  policy: pull

.pacman: &pacman
  - |
    sed -i 's/^#DisableDownloadTimeout/DisableDownloadTimeout/' /etc/pacman.conf
    grep -q '^DisableDownloadTimeout' /etc/pacman.conf || sed -i '/^\[options\]/a DisableDownloadTimeout' /etc/pacman.conf
    if [ -n "$ARCH_SNAPSHOT" ]; then
      printf 'Server = https://archive.archlinux.org/repos/%s/$repo/os/$arch\n' "$ARCH_SNAPSHOT" > /etc/pacman.d/mirrorlist
    fi
    cat /etc/pacman.d/mirrorlist | grep -v '^#' | grep . || true

# GitLab runners check the repo out with umask 0000, so .build/tmp arrives 0777 (and it is
# in no cache or artifact: those only hold cargo-home, target, zig-dl and the two build
# outputs). The tests already create a private 0700 directory per test under .build/tmp
# and gungnird refuses any socket dir others can write to; this is only belt and braces.
.private-tmp: &private-tmp
  - |
    umask 0022
    mkdir -p .build/tmp
    chmod go-w .build .build/tmp

# The test jobs run their tests as an unprivileged user, like gungnird itself (a per-user
# daemon): as root, the tests of what an unreadable file does cannot run (root reads
# everything). The runner's checkout (sources, caches, .build) is handed to that user.
# runuser keeps the job's environment (PATH with Zig, CARGO_HOME, ...), only HOME changes.
.as-tester: &as-tester
  - |
    id tester >/dev/null 2>&1 || useradd -m -U tester
    # A subordinate uid range, so the cross-user tests can run a second user (a SKIP line
    # in the log where the container cannot map one).
    grep -q '^tester:' /etc/subuid 2>/dev/null || usermod --add-subuids 200000-265535 --add-subgids 200000-265535 tester || echo "no subordinate ids for tester"
    chown -R tester:tester "$CI_PROJECT_DIR"

# Every job normally finishes in under 4 minutes, so a stalled runner or a hung step
# fails at 20 minutes instead of the project's (by default 1 hour). Test jobs: 25.
.rust:
  timeout: 20 minutes
  cache:
    - *cargo-cache
  before_script:
    - *private-tmp
    - *pacman
    - |
      # Three attempts, then fail the job here (RC-F023), not later on a missing tool.
      for attempt in 1 2 3; do
        if pacman -Syuu --noconfirm --needed rust gcc pkgconf; then
          break
        fi
        if [ "$attempt" = 3 ]; then
          echo "pacman install failed 3 times" >&2
          exit 1
        fi
        echo "pacman install attempt $attempt failed; retrying in 5s..." >&2
        sleep 5
        pacman -Syy --noconfirm || true
      done
    - rustc --version && cargo --version && cargo clippy --version && cargo fmt --version

# Zig jobs also need Rust: the Zig integration test builds and starts gungnird.
.zig:
  timeout: 20 minutes
  cache:
    - *cargo-cache
    - *zig-cache
  before_script:
    - *private-tmp
    - *pacman
    - |
      # Three attempts, then fail the job here (RC-F023), not later on a missing tool.
      for attempt in 1 2 3; do
        if pacman -Syuu --noconfirm --needed rust gcc glib2 pkgconf binutils minisign jq curl xz tar; then
          break
        fi
        if [ "$attempt" = 3 ]; then
          echo "pacman install failed 3 times" >&2
          exit 1
        fi
        echo "pacman install attempt $attempt failed; retrying in 5s..." >&2
        sleep 5
        pacman -Syy --noconfirm || true
      done
    - |
      # Install Zig master from ziglang.org; fail unless minisign verifies the tarball.
      # Each curl attempt is time-boxed, and one that stalls (under 10 kB/s for 60 s) is
      # aborted and retried at once instead of sitting out --max-time (pacman already
      # aborts transfers that stall, via its default download timeout).
      set -eo pipefail
      dl=.build/zig-dl
      mkdir -p "$dl/cache"
      curl -fsSL --retry 3 --connect-timeout 30 --speed-limit 10240 --speed-time 60 --max-time 120 "$ZIG_INDEX_URL" -o "$dl/index.json"
      ZIG_VERSION=$(jq -er '.master.version' "$dl/index.json")
      ZIG_URL=$(jq -er '.master["x86_64-linux"].tarball' "$dl/index.json")
      ZIG_SHA=$(jq -er '.master["x86_64-linux"].shasum' "$dl/index.json")
      ZIG_TARBALL=${ZIG_URL##*/}
      [ "$ZIG_TARBALL" = "zig-x86_64-linux-$ZIG_VERSION.tar.xz" ] \
        || { echo "unexpected Zig tarball name: $ZIG_TARBALL (master is $ZIG_VERSION)" >&2; exit 1; }
      # Reuse the cached download only if it is this exact tarball; it is verified anyway.
      if [ "$(cat "$dl/cache/name" 2>/dev/null)" != "$ZIG_TARBALL" ]; then
        curl -fsSL --retry 3 --connect-timeout 30 --speed-limit 10240 --speed-time 60 --max-time 600 "$ZIG_URL" -o "$dl/cache/zig.tar.xz"
        curl -fsSL --retry 3 --connect-timeout 30 --speed-limit 10240 --speed-time 60 --max-time 120 "$ZIG_URL.minisig" -o "$dl/cache/zig.tar.xz.minisig"
        echo "$ZIG_TARBALL" > "$dl/cache/name"
      fi
      minisign -Vm "$dl/cache/zig.tar.xz" -P "$ZIG_PUBKEY" > "$dl/minisign.out" \
        || { cat "$dl/minisign.out"; echo "Zig tarball signature verification FAILED" >&2; exit 1; }
      cat "$dl/minisign.out"
      # The signed trusted comment is "timestamp:<n>\tfile:<name>\thashed": require the
      # exact file field, so a validly signed but different tarball is rejected.
      awk -F'\t' -v want="file:$ZIG_TARBALL" '
        /^Trusted comment: / { for (i = 1; i <= NF; i++) if ($i == want) ok = 1 }
        END { exit !ok }' "$dl/minisign.out" \
        || { echo "signed file name does not match $ZIG_TARBALL" >&2; exit 1; }
      echo "$ZIG_SHA  $dl/cache/zig.tar.xz" | sha256sum -c -
      rm -rf "$dl/zig" && mkdir -p "$dl/zig"
      tar -xJf "$dl/cache/zig.tar.xz" -C "$dl/zig" --strip-components=1
      export PATH="$CI_PROJECT_DIR/$dl/zig:$PATH"
      [ "$(zig version)" = "$ZIG_VERSION" ] || { echo "zig version mismatch" >&2; exit 1; }
      # Refuse a master older than the oldest nightly the project is verified on.
      min=$(sed -n 's/^ *\.minimum_zig_version = "\(.*\)",$/\1/p' src/client-zig/build.zig.zon)
      [ -n "$min" ] || { echo "no minimum_zig_version in build.zig.zon" >&2; exit 1; }
      oldest=$(printf '%s\n%s\n' "$min" "$ZIG_VERSION" | sort -V | head -n1)
      [ "$oldest" = "$min" ] || { echo "Zig master $ZIG_VERSION is older than minimum_zig_version $min" >&2; exit 1; }
    - zig version
    - rustc --version && pkg-config --modversion gio-2.0

# ---- lint -------------------------------------------------------------------

rust:lint:
  stage: lint
  extends: .rust
  # Every job calls one ./check subcommand: the commands themselves live only there.
  script:
    - ./check rust-static

zig:lint:
  stage: lint
  extends: .zig
  cache:
    - *cargo-cache
    - <<: *zig-cache
      policy: pull-push
  script:
    - ./check zig-static

# ---- build ------------------------------------------------------------------

rust:build:
  stage: build
  extends: .rust
  needs: ["rust:lint"]
  cache:
    - <<: *cargo-cache
      policy: pull-push
  script:
    # Builds the release gungnird; the shipped daemon must never carry the test hooks.
    - ./check release-hooks
  artifacts:
    name: gungnird
    paths: [.build/target/release/gungnird]
    expire_in: 1 week

zig:build:
  stage: build
  extends: .zig
  needs: ["zig:lint"]
  script:
    # Builds the module: three GIO exports only, no test hook, indexed by gio-querymodules.
    - ./check zig-artifacts
  artifacts:
    name: libgiogungnir
    paths: [.build/zig-out/lib/libgiogungnir.so]
    expire_in: 1 week

# ---- test -------------------------------------------------------------------

rust:test:
  stage: test
  extends: .rust
  timeout: 25 minutes
  needs: ["rust:build"]
  variables:
    # What this container cannot have (btrfs) is skipped, each test on a SKIP line in the
    # log; everything else must run (gungnird::testenv). The io_uring engine tests must
    # run, never skip: ./check requires io_uring whenever CI is set (D-061).
    GUNGNIR_ALLOW_MISSING: "1"
  script:
    - *as-tester
    # --no-fail-fast (inside ./check): one failing test binary must not hide the others.
    - runuser -u tester -- ./check test default

# The tests that need the test-hooks build (AGENTS.md: cargo test must also pass with
# --features test-hooks): about 20 more, among them the cross-user security tests (another
# user refused at the socket, someone else's trash never ours), drain and live-upgrade
# refusals, volume trash on hung mounts. Without this job they ran on no pipeline.
rust:test-hooks:
  stage: test
  extends: .rust
  timeout: 25 minutes
  needs: ["rust:build"]
  variables:
    GUNGNIR_ALLOW_MISSING: "1"
  script:
    - *as-tester
    # Prints what did not run here, one SKIP line each.
    - runuser -u tester -- ./check test hooks
    # The cross-user tests need a second user. As tester they cannot have one here (the
    # container's newuidmap cannot map a range), so they run again as root, which drops to
    # `nobody` (testenv::as_other_user): no opt-out, they must run or fail.
    - |
      chown -R root:root "$CI_PROJECT_DIR/.build"
      ./check cross-user

# Milestone 8: the thread-pool fallback engine, forced. Its own job, in every pipeline,
# needing only rust:build, so an io_uring failure in rust:test never hides it (D-048,
# RC-F022).
rust:test-no-uring:
  stage: test
  extends: .rust
  timeout: 25 minutes
  needs: ["rust:build"]
  variables:
    GUNGNIR_ALLOW_MISSING: "1"
  script:
    - *as-tester
    - runuser -u tester -- ./check test no-uring

zig:test:
  stage: test
  extends: .zig
  # rust:build's gungnird artifact + the cargo cache keep the itest's cargo build incremental.
  timeout: 25 minutes
  needs: ["zig:build", "rust:build"]
  variables:
    GUNGNIR_ALLOW_MISSING: "1"
  script:
    - *as-tester
    # Also checks the itest's test-hooks daemon never landed over the release artifact.
    - runuser -u tester -- ./check zig-test

# The 50k-event stress benchmark (AGENTS.md §4) with its wall-clock, p99 and peak-RSS
# SLO asserts unchanged. Not a per-push correctness gate (shared runners make the timing
# noisy, D-055), so it runs in scheduled and manually started pipelines only; when it
# runs, a missed SLO fails the pipeline (no allow_failure). RC-F025.
rust:perf:
  stage: test
  extends: .rust
  timeout: 25 minutes
  needs: ["rust:build"]
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "web"
    # An API-started pipeline asks for it by name (PR-F014); plain API pipelines do not.
    - if: $CI_PIPELINE_SOURCE == "api" && $RUN_PERF == "1"
  script:
    - ./check perf
